name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI + uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests / Lint (example)
        run: uv run pytest # Replace with your test command if you have tests

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # or 'pnpm' / 'yarn' depending on your package manager

      - name: Install dependencies
        run: npm ci # Use pnpm i or yarn if using pnpm/yarn

      - name: Type check
        run: npm run type-check # Ensure package.json has "type-check": "tsc --noEmit"

      - name: Lint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
